<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <style>
        .form-field {
            padding: 8px;
        }
        .error-message {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-left: 8px;
            display: none;
        }
        .invalid-input {
            border: 1px solid #d32f2f;
            outline: none;
        }
        .valid-input {
            border: 1px solid #2e7d32;
        }
    </style>
</head>
<body>
    <h1>Registration form</h1>
    <form id="registrationForm">
        <div class="form-field">
            <label for="firstName">First Name:-</label>
            <input type="text" id="firstName">
        </div>
        <div class="form-field">
            <label for="secondName">Second Name:-</label>
            <input type="text" id="secondName">
        </div>
        <div class="form-field">
            <label for="contact">Contact:-</label>
            <input 
                type="tel" 
                id="contact" 
                maxlength="10" 
                placeholder="10-digit number"
                required
            >
            <span id="contactError" class="error-message">Must be exactly 10 digits (0/10)</span>
        </div>
        <div class="form-field">
            <label for="email">E-mail:-</label>
            <input type="email" id="email">
        </div>
        <button type="submit">Submit</button>
    </form>

    <script>
        const contactInput = document.getElementById('contact');
        const contactError = document.getElementById('contactError');
        const form = document.getElementById('registrationForm');

        contactInput.addEventListener('input', () => {
        
            contactInput.value = contactInput.value.replace(/\D/g, '');
            
            const currentLength = contactInput.value.length;

            if (currentLength === 0) {
                contactError.style.display = 'none';
                contactInput.className = '';
            } else if (currentLength < 10) {
                contactError.textContent = `Must be exactly 10 digits (${currentLength}/10)`;
                contactError.style.display = 'inline';
                contactInput.className = 'invalid-input';
            } else {
                contactError.style.display = 'none';
                contactInput.className = 'valid-input';
            }
        });

        form.addEventListener('submit', (e) => {
            if (contactInput.value.length !== 10) {
                e.preventDefault();
                contactError.textContent = 'Please provide a valid 10-digit contact number.';
                contactError.style.display = 'inline';
                contactInput.className = 'invalid-input';
                contactInput.focus();
            }
        });
    </script>
</body>
</html>
